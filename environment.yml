channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # R runtime only. renv owns every R package.
  - r-base=4.5
  # build toolchain for renv source installs
  - compilers
  - make
  - cmake
  - pkg-config
  # C libraries commonly needed by R packages
  - libcurl
  - openssl
  - libxml2
  - zlib
  - zeromq          # IRkernel -> pbdZMQ
  - freetype
  - fontconfig
  - harfbuzz
  - fribidi
  - libpng
  - libjpeg-turbo
  - libtiff
  - libwebp
  - gettext
  - pandoc          # rmarkdown
  # Jupyter front end (kernels come from uv and renv)
  - jupyterlab
  - jupyterlab-lsp
  - lckr_jupyterlab_variableinspector
  # CLI tools
  - samtools
  - bedtools
